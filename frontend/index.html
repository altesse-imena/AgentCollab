<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Jost:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentCollab</title>
    <meta
      name="description"
      content="Four AI agents write, review, test and security-check a code change together. Watch recorded runs play back, or read them as case studies."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://agentcollab.onrender.com/" />
    <meta property="og:title" content="AgentCollab: four AI agents, one reviewed change" />
    <meta
      property="og:description"
      content="A writer drafts the code; a reviewer, a tester and a security analyst check it in parallel; a judge sends it back until it passes."
    />
    <meta property="og:image" content="https://agentcollab.onrender.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="750" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved theme before the first paint (dark by default, like altesseimena.com)
      try {
        document.documentElement.classList.toggle(
          'dark',
          localStorage.getItem('agentcollab-theme') !== 'light',
        )
      } catch {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
